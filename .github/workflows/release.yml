name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the in-app updater compares this file with the release tag
      - name: Check version
        run: |
          v=$(grep -oP '"Version":\s*"\K[^"]+' src/version.json)
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "src/version.json says $v but the tag is ${GITHUB_REF_NAME}"; exit 1
          fi
          if grep -q 'YOUR_GITHUB_NAME' src/version.json; then
            echo "set \"Repo\" in src/version.json to <owner>/BatteryRings"; exit 1
          fi

      - name: Build zip
        run: |
          mkdir -p dist/BatteryRings
          cp -r Install.cmd Uninstall.cmd README.md README.en.md LICENSE src dist/BatteryRings/
          cd dist && zip -r BatteryRings.zip BatteryRings

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BatteryRings.zip
          generate_release_notes: true
